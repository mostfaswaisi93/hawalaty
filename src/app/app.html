<div class="flex h-screen flex-col" [dir]="dir()">
  <mat-toolbar color="primary" class="z-10 shadow">
    <button mat-icon-button (click)="drawer.toggle()" aria-label="menu">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="mx-2 text-lg font-bold">{{ 'app.name' | translate }}</span>
    <span class="flex-1"></span>
    <app-language-switcher />
  </mat-toolbar>

  <mat-sidenav-container class="flex-1">
    <mat-sidenav #drawer mode="side" opened class="w-60 border-0">
      <mat-nav-list>
        @for (item of nav; track item.link) {
          <a
            mat-list-item
            [routerLink]="item.link"
            routerLinkActive
            #rla="routerLinkActive"
            [activated]="rla.isActive">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.key | translate }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="p-4 md:p-6">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
